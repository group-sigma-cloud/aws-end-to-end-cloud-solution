name: Group Sigma CI

on:
  push:
    branches:
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-application:
    name: Validate Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate website files and HTML references
        run: python scripts/validate_site.py

      - name: Verify project documentation
        run: |
          test -f Readme.md
          test -f aws/README.md
          test -f application/README.md
          echo "Project documentation checks passed."
